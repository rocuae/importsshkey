name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [iskey, go-server]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.component }}/go.mod
          cache-dependency-path: ${{ matrix.component }}/go.sum
      - name: Test
        working-directory: ${{ matrix.component }}
        run: go test -race ./...
      - name: Vet
        working-directory: ${{ matrix.component }}
        run: go vet ./...
      - name: Format
        working-directory: ${{ matrix.component }}
        run: test -z "$(gofmt -l .)"

  go-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: iskey/go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: iskey
          args: --config=../.golangci.yml
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: go-server
          args: --config=../.golangci.yml

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        working-directory: iskey-rust
        run: cargo fmt --check
      - name: Clippy
        working-directory: iskey-rust
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: iskey-rust
        run: cargo test

  cf:
    name: Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cf-server/package-lock.json
      - name: Install
        working-directory: cf-server
        run: npm ci
      - name: Type check
        working-directory: cf-server
        run: npx tsc --noEmit
      - name: Test
        working-directory: cf-server
        run: npm test -- --run

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-server/go.mod
      - name: Run e2e
        run: make test-e2e
