name: Build Linux binaries

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go-server/go.mod
          cache-dependency-path: |
            iskey/go.sum
            go-server/go.sum

      - name: Build iskey
        run: |
          cd iskey
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build -trimpath -ldflags="-s -w" -o ../bin/iskey-linux-${{ matrix.arch }} ./cmd/iskey

      - name: Build go-server
        run: |
          cd go-server
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build -trimpath -ldflags="-s -w" -o ../bin/iskey-server-linux-${{ matrix.arch }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: binaries-linux-${{ matrix.arch }}
          path: bin/
          if-no-files-found: error

  release:
    name: Publish to GitHub Releases
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: bin
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: bin/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
